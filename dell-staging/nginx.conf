server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        try_files $uri =404;
    }
}
