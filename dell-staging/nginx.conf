server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'" always;
  location = /health { default_type text/plain; return 200 "ok\n"; }
  location = / { try_files /index.html =404; }
  location / { try_files $uri =404; }
}
