<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1e272d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JK Works" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>JK Works Dordrecht</title>
</head>
<body class="auth-locked">
  <section id="authGate" class="auth-gate" aria-label="Inloggen">
    <div class="auth-card">
      <img src="assets/jk-works-logo.jpg" alt="JK Works Dordrecht" class="auth-logo">
      <div class="auth-kicker">JK WORKS DORDRECHT</div>
      <h1>Bedrijfsapp</h1>
      <p class="auth-intro">Log in met je JK Works-account om de app te openen en je gegevens te synchroniseren.</p>
      <form id="siteLoginForm" class="auth-form">
        <div class="field"><label for="siteLoginEmail">E-mail</label><input id="siteLoginEmail" type="email" name="email" required autocomplete="email"></div>
        <div class="field"><label for="siteLoginPassword">Wachtwoord</label><input id="siteLoginPassword" type="password" name="password" required minlength="6" autocomplete="current-password"></div>
        <button class="primary auth-submit" type="submit">Inloggen</button>
        <p id="siteLoginError" class="auth-error" role="alert" hidden></p>
      </form>
      <p class="auth-note">Dezelfde inlog gebruik je op je iPhone en MacBook. Je blijft ingelogd totdat je zelf uitlogt.</p>
    </div>
  </section>

  <div id="appShell" hidden>
    <header class="topbar">
      <div class="brand-title"><img src="assets/jk-works-logo.jpg" alt="JK Works Dordrecht"><div><div class="eyebrow">JK WORKS DORDRECHT</div><h1 id="pageTitle">Dashboard</h1></div></div>
      <div class="top-actions"><button id="manualSyncBtn" class="sync-btn" type="button" aria-label="Handmatig synchroniseren" title="Handmatig synchroniseren" hidden>☁ <span>Sync</span></button><button id="topLogoutBtn" class="logout-btn" type="button" aria-label="Uitloggen" title="Uitloggen" hidden>⎋ <span>Uitloggen</span></button><button id="quickAddBtn" class="icon-btn" aria-label="Snel toevoegen">+</button></div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Hoofdnavigatie">
      <button data-route="dashboard" class="nav-item active"><span>⌂</span><small>Start</small></button>
      <button data-route="jobs" class="nav-item"><span>▣</span><small>Klussen</small></button>
      <button data-route="gear" class="nav-item"><span>🧰</span><small>Materiaal</small></button>
      <button data-route="documents" class="nav-item"><span>▤</span><small>Documenten</small></button>
      <button data-route="more" class="nav-item"><span>•••</span><small>Meer</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="modalRoot"></div>

  <input id="hiddenExistingPdfInput" type="file" accept="application/pdf" multiple hidden />
  <input id="hiddenBackupInput" type="file" accept="application/json,.jkbackup,.jkbackup.json" hidden />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
</body>
</html>
