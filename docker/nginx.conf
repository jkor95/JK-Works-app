server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Keep exact file and directory routing used by the original GitHub Pages site.
    location / {
        try_files $uri $uri/ =404;
    }

    # Service workers and PWA manifests should always be revalidated.
    location ~* (^|/)(service-worker\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Authentication and business app pages must not be stored by shared caches.
    location ~ ^/(app|inloggen)/index\.html$ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Block repository-only configuration and operational files.
    location ~ (^|/)(\.|AGENTS\.md$|CNAME$|README\.md$|CHANGELOG\.md$|.*\.sql$|.*\.py$|.*\.cjs$) {
        return 404;
    }
}
