name: Self-host API tests
on:
  push:
    branches:
      - codex/zelfstandige-backend-voorbereiding
    paths:
      - 'selfhost-api/**'
      - '.github/workflows/selfhost-api-tests.yml'
  pull_request:
    paths:
      - 'selfhost-api/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selfhost-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: selfhost-api/package-lock.json
      - run: npm ci
      - run: npm test
