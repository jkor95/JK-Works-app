name: JK Works controles

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Statische site en browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Installeer uitsluitend testhulpmiddelen buiten de checkout
        run: npm install --prefix "$RUNNER_TEMP/jk-tests" --no-save --package-lock=false playwright@1.62.1
      - name: Installeer Chromium voor de test
        run: |
          "$RUNNER_TEMP/jk-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Controleer site en browsergedrag
        env:
          NODE_PATH: ${{ runner.temp }}/jk-tests/node_modules
        run: node scripts/check.cjs
