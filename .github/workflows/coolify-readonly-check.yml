name: Coolify read-only connection check
on:
  workflow_dispatch:
  push:
    branches:
      - codex/zelfstandige-backend-voorbereiding
    paths:
      - '.github/workflows/coolify-readonly-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Coolify API without exposing credentials
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error, sys
          token=os.environ.get('COOLIFY_API_TOKEN','')
          if not token:
              print('FAILED: COOLIFY_API_TOKEN secret is missing')
              sys.exit(1)
          url='https://coolify.jkworks.nl/api/v1/servers'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'},method='GET')
          try:
              with urllib.request.urlopen(req,timeout=15) as response:
                  payload=response.read(1024*1024)
                  print('SUCCESS: Coolify read-only API authenticated (HTTP '+str(response.status)+')')
                  print('Response received: '+str(len(payload))+' bytes; content deliberately not logged')
          except urllib.error.HTTPError as e:
              print('FAILED: Coolify API returned HTTP '+str(e.code)+' (response body hidden)')
              sys.exit(1)
          except Exception as e:
              print('FAILED: Coolify API connection error ('+type(e).__name__+')')
              sys.exit(1)
          PY
